version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: little_messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=little_messenger
    depends_on:
      - postgres

volumes:
  postgres_data: